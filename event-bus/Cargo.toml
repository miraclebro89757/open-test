[package]
name = "opentest-event-bus"
version = "1.0.0"
edition = "2021"
authors = ["miraclebro89757"]
license = "Apache-2.0"
description = "Zero-allocation event bus using mmap and ring buffer for IPC"

[dependencies]
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
anyhow = "1.0"
crossbeam = "0.8"
parking_lot = "0.12"
atomic = "0.6"
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "event_bus_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
