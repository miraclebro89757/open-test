[package]
name = "opentest-integration-tests"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# No additional dev dependencies needed for basic tests

[[test]]
name = "integration_test"
path = "integration_test.rs"

[[test]]
name = "test_worker_pool"
path = "test_worker_pool.rs"

[[test]]
name = "test_semantic_engine"
path = "test_semantic_engine.rs"

[[test]]
name = "test_event_bus"
path = "test_event_bus.rs"
