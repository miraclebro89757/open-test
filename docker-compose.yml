version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: open-test-postgres
    environment:
      POSTGRES_DB: wharttest
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: open-test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5.24-community
    container_name: open-test-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: open-test-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  api:
    build:
      context: ./api
    container_name: open-test-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://admin:password@postgres:5432/wharttest
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - postgres
      - redis
      - neo4j
      - elasticsearch
    restart: unless-stopped

  agent:
    build:
      context: ./agent
    container_name: open-test-agent
    environment:
      PYTHONUNBUFFERED: 1
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://admin:password@postgres:5432/wharttest
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      - postgres
      - redis
      - neo4j
      - api
    restart: unless-stopped

  executor:
    build:
      context: ./executor
    container_name: open-test-executor
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:8000
    depends_on:
      - redis
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: open-test-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: ws://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_plugins:
  elasticsearch_data:
