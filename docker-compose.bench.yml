name: opentest-bench

services:
  bench:
    image: opentest-bench-bench
    pull_policy: never
    build:
      context: ./agent
      dockerfile: Dockerfile.bench
    container_name: opentest-bench
    ports:
      - "8787:8787"
    environment:
      HOME: /root
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${HOME}/.opentest/config.json:/root/.opentest/config.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s
    restart: unless-stopped
