[package]
name = "opentest-semantic-engine"
version = "1.0.0"
edition = "2021"
authors = ["miraclebro89757"]
license = "Apache-2.0"
description = "Semantic AST Engine with multi-dimensional element fingerprinting"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.21"
scraper = "0.18"
html5ever = "0.26"
cssparser = "0.31"
ndarray = "0.15"
nalgebra = "0.32"
blake3 = "1.5"
once_cell = "1.19"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "fingerprint_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
